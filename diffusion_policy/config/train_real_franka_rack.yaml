_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

# Shared anchors
shape_meta: &shape_meta
  action:
    shape: [10]
  obs:
    agentview_rgb:
      shape: [3, 240, 320]
      type: rgb
    eye_in_hand_rgb:
      shape: [3, 240, 320]
      type: rgb
    ee_states:
      shape: [16]
    joint_states:
      shape: [7]
    gripper_states:
      shape: [1]

dataset_path: &dataset_path /home/carl_lab/ola/dish_rack.hdf5

# Checkpointing
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# Dataloaders
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

# Training-wide params
dataset_obs_steps: 2
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
past_action_visible: false

# EMA
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  betas: [0.95, 0.999]
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06

# Policy
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  horizon: 16
  n_obs_steps: 2
  n_action_steps: 8
  n_groups: 8
  kernel_size: 5
  cond_predict_scale: true
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  crop_shape: [180, 180]
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  num_inference_steps: 100

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small

  shape_meta: *shape_meta

# Task
task:
  task_name: square
  name: square_image
  abs_action: true
  dataset_type: mh
  dataset_path: *dataset_path
  shape_meta: *shape_meta

  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    abs_action: true
    dataset_path: *dataset_path
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    shape_meta: *shape_meta
    use_cache: true
    val_ratio: 0.02
  
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    abs_action: true
    crf: 22
    dataset_path: *dataset_path
    fps: 10
    max_steps: 500
    n_action_steps: 8
    n_envs: 28
    n_obs_steps: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    past_action: false
    render_obs_key: agentview_rgb
    shape_meta: *shape_meta
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    train_start_idx: 0

# Training
training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 1000
  resume: false
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
